services:
  ddddocr:
    build: .
    container_name: xlnetacc-ddddocr
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      # 建议改为一段随机字符串，并在 LuCI 的“局域网 OCR Token”填写相同内容。
      OCR_TOKEN: "change-this-to-a-random-token"
      # 平均字符置信度低于此值时，服务只返回结果但不会允许插件自动提交。
      MIN_CONFIDENCE: "0.75"
